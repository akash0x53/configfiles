# terminal font
# https://www.nerdfonts.com/font-downloads


# Plugins
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'


set -g history-limit 10000

set-option -g default-shell /bin/bash


# Reaching for '0' key is HARD
set -g base-index 1
set -g pane-base-index 1
set -g mouse on

# remap prefix key to Ctrl+a
unbind C-a
set -g prefix C-a

# detach from current session
bind-key C-d detach-client

# reload tmux config
unbind r
bind r source-file ~/.tmux.conf \; display "Reloading config..."

# Splits

# vertical splits pane
unbind v
unbind C-v
bind-key v split-window -h
bind-key C-v split-window -h

# horizontal split pane
unbind h
unbind C-h
bind-key h split-window
bind-key C-h split-window

unbind p
bind-key p display-popup -d "#{pane_current_path}" -w 70% -h 50% -E 'python3'
unbind b
bind-key b display-popup -d "#{pane_current_path}" -w 70% -h 50% -E 'bash'
unbind g
bind-key g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E 'lazygit'
unbind C-c
bind C-c display-popup -d "#{pane_current_path}" -w 70% -h 50% -E '~/.local/bin/copilot'

# Close pane
#unbind w
#unbind C-w
#bind-key w kill-pane
#bind-key C-w kill-pane

#
setw -g monitor-activity on
setw -g mode-keys vi
set -g visual-activity on
set -g set-titles on  # show activity on terminal title

set -g automatic-rename off


# tmux catppuccin theme defaults
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavour 'mocha' # latte, frappe, macchiato, mocha

run ~/.tmux/plugins/catppuccin/catppuccin.tmux

set -g default-terminal "tmux-256color"
set -g @catppuccin_window_status_style "underscore"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_default_text "#W"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_window}"
set -g status-left "#{E:@catppuccin_status_window}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
#set -ag status-right "#{E:@catppuccin_status_uptime}"


run '~/.tmux/plugins/tpm/tpm'
